# Dezignatek look, dark: deep navy page, brand-navy panels, teal accent, light text.
# Fine-grained styling (fonts, wordmark header, pill buttons) is in plant_sim/theme.py.
[theme]
base = "dark"
primaryColor = "#00C3B1"
backgroundColor = "#0E1320"
secondaryBackgroundColor = "#171F32"
textColor = "#EEF1F6"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
