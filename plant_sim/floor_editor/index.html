<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Factory floor editor</title>
<style>
  :root { --bg:#0f1620; --panel:#16202c; --border:#253242; --text:#e6edf3; --muted:#8b98a5;
          --day:#4bc9c9; --aft:#e0a83e; --accent:#4472C4; --ok:#3fb950; --warn:#e0a83e; --bad:#e5484d;
          --chip:#1d2a3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; font-size:12px; }
  .lane { border:1px solid var(--border); border-radius:10px; padding:8px 10px 10px; margin-bottom:12px; background:var(--panel); }
  .lane-title { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:6px; }
  .lane-title .dot { width:9px; height:9px; border-radius:50%; }
  .lane.day .dot { background:var(--day); box-shadow:0 0 6px var(--day); }
  .lane.aft .dot { background:var(--aft); box-shadow:0 0 6px var(--aft); }
  .lane-title .hint { font-weight:400; color:var(--muted); font-size:11px; margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(6, minmax(118px, 1fr)) minmax(118px, 1fr) minmax(96px, 0.8fr);
          grid-template-rows:auto auto; gap:6px; }
  .row-label { grid-column:1 / -1; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .station { background:#101823; border:1px solid var(--border); border-radius:9px; padding:7px 8px 8px; min-height:118px;
             display:flex; flex-direction:column; transition:border-color .15s, background-color .15s; }
  .station.span2 { grid-row: span 2; }
  .station.empty-slot { visibility:hidden; }
  .station.over-ok { border-color:var(--ok); background:#12211a; }
  .station.over-learn { border-color:var(--warn); background:#241f12; }
  .st-head { display:flex; align-items:baseline; gap:5px; margin-bottom:4px; }
  .st-icon { font-size:14px; }
  .st-name { font-size:11px; font-weight:700; line-height:1.15; }
  .st-cover { font-size:10px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
  .cov-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  .cov-dot.ok { background:var(--ok); } .cov-dot.warn { background:var(--warn); } .cov-dot.bad { background:var(--bad); }
  .chips { display:flex; flex-direction:column; gap:4px; flex:1; min-height:24px; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--chip); border:1px solid var(--border); border-radius:6px;
          padding:3px 6px; cursor:grab; user-select:none; font-size:11px; line-height:1.2; }
  .chip:active { cursor:grabbing; }
  .chip.dragging { opacity:.4; }
  .chip.surplus { border-style:dashed; opacity:.75; }
  .avatar { width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:9px; font-weight:700;
            display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .chip .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip .sk { font-size:9px; color:var(--muted); flex:0 0 auto; }
  .footer { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:10.5px; padding:2px 4px; }
  .footer b { color:var(--text); }
  .flash { position:fixed; right:12px; bottom:12px; background:#1d2a3a; border:1px solid var(--accent); border-radius:8px;
           padding:8px 12px; font-size:11.5px; opacity:0; transition:opacity .25s; pointer-events:none; }
  .flash.show { opacity:1; }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="footer">
    <span>Drag a person onto any station, in either shift lane. <b>Green</b> border = already qualified there,
      <b>amber</b> = will be set as their new home (their old home is kept as a skill).</span>
    <span>Coverage dot: <b style="color:var(--ok)">●</b> at/above ideal crew &nbsp; <b style="color:var(--warn)">●</b> below ideal
      &nbsp; <b style="color:var(--bad)">●</b> nobody &nbsp; dashed chip = more people than the machine can use.</span>
  </div>
  <div class="flash" id="flash"></div>

<script>
// --- Streamlit component protocol (vanilla, no build step) -------------
function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setFrameHeight() {
  // Measure the content, not documentElement.scrollHeight - the latter can
  // never be smaller than the iframe's current height, so the frame would
  // only ever grow (e.g. after the window gets wider and lanes get shorter).
  const root = document.getElementById("root");
  const footer = document.querySelector(".footer");
  const h = Math.ceil(root.offsetHeight + footer.offsetHeight + 12);
  sendToStreamlit("streamlit:setFrameHeight", { height: h });
}
let seq = Date.now();
function emit(value) {
  seq += 1;
  sendToStreamlit("streamlit:setComponentValue", { value: Object.assign({ seq: seq }, value), dataType: "json" });
}

// --- Rendering -----------------------------------------------------------
let ARGS = null;
let dragging = null;   // {opId, fromStation, fromShift}

function initials(name) {
  const parts = name.replace(/\(.*?\)/g, "").trim().split(/\s+/);
  return parts.slice(0, 2).map(p => p[0] ? p[0].toUpperCase() : "").join("");
}

function coverageClass(count, ideal) {
  if (count === 0 && ideal > 0) return "bad";
  if (count < ideal) return "warn";
  return "ok";
}

function render(args) {
  ARGS = args;
  const root = document.getElementById("root");
  root.innerHTML = "";
  const staffByKey = {};
  args.staff.forEach(p => {
    const k = p.shift + "|" + p.home;
    (staffByKey[k] = staffByKey[k] || []).push(p);
  });

  args.shifts.forEach(shift => {
    const lane = document.createElement("div");
    lane.className = "lane " + shift.id;
    lane.innerHTML = `<div class="lane-title"><span class="dot"></span>${shift.label}
      <span class="hint">${shift.hint || ""}</span></div>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    args.rows.forEach((row, ri) => {
      row.stations.forEach((sid, ci) => {
        grid.appendChild(stationBox(sid, shift.id, staffByKey, ri + 1, ci + 1));
      });
      // pad the shorter row so the shared columns line up on the right
      for (let ci = row.stations.length; ci < args.columns; ci++) {
        const pad = document.createElement("div");
        pad.className = "station empty-slot";
        pad.style.gridRow = String(ri + 1); pad.style.gridColumn = String(ci + 1);
        grid.appendChild(pad);
      }
    });
    args.shared.forEach((sid, i) => {
      const box = stationBox(sid, shift.id, staffByKey, 1, args.columns + 1 + i);
      box.classList.add("span2");
      grid.appendChild(box);
    });
    lane.appendChild(grid);
    root.appendChild(lane);
  });
  setFrameHeight();
}

function stationBox(sid, shiftId, staffByKey, gridRow, gridCol) {
  const st = ARGS.stations[sid];
  const people = staffByKey[shiftId + "|" + sid] || [];
  const box = document.createElement("div");
  box.className = "station";
  box.style.gridRow = String(gridRow); box.style.gridColumn = String(gridCol);
  box.dataset.station = sid; box.dataset.shift = shiftId;
  const cov = coverageClass(people.length, st.ideal_ops);
  const capNote = (st.max_useful_ops !== null && people.length > st.max_useful_ops)
    ? ` (${people.length - st.max_useful_ops} surplus)` : "";
  box.innerHTML = `
    <div class="st-head"><span class="st-icon">${st.icon}</span><span class="st-name">${st.label}</span></div>
    <div class="st-cover"><span class="cov-dot ${cov}"></span>${people.length} staff / ideal ${st.ideal_ops}${capNote}</div>
    <div class="chips"></div>`;
  const chips = box.querySelector(".chips");
  people.forEach((p, i) => {
    const chip = document.createElement("div");
    chip.className = "chip" + ((st.max_useful_ops !== null && i >= st.max_useful_ops) ? " surplus" : "");
    chip.draggable = true;
    chip.dataset.op = p.id;
    const skillNames = p.skills.map(s => ARGS.stations[s] ? ARGS.stations[s].label : s);
    chip.title = `${p.name}\nHome: ${st.label}, ${shiftId} shift\nAlso skilled: ${skillNames.join(", ") || "-"}\nAbsence rate: ${p.absence}%`;
    chip.innerHTML = `<span class="avatar">${initials(p.name)}</span><span class="nm">${p.name}</span>` +
      (p.skills.length ? `<span class="sk">+${p.skills.length}</span>` : "");
    chip.addEventListener("dragstart", e => {
      dragging = { opId: p.id, fromStation: sid, fromShift: shiftId, skills: p.skills, name: p.name };
      chip.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", p.id); } catch (_) {}
    });
    chip.addEventListener("dragend", () => { chip.classList.remove("dragging"); dragging = null; clearHighlights(); });
    chips.appendChild(chip);
  });

  box.addEventListener("dragover", e => {
    if (!dragging) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const qualified = dragging.fromStation === sid || dragging.skills.includes(sid);
    box.classList.toggle("over-ok", qualified);
    box.classList.toggle("over-learn", !qualified);
  });
  box.addEventListener("dragleave", () => { box.classList.remove("over-ok", "over-learn"); });
  box.addEventListener("drop", e => {
    e.preventDefault();
    if (!dragging) return;
    const d = dragging;
    box.classList.remove("over-ok", "over-learn");
    if (d.fromStation === sid && d.fromShift === shiftId) return;   // dropped back where they were
    flash(`${d.name} -> ${st.label}, ${shiftId} shift`);
    emit({ op_id: d.opId, to_station: sid, to_shift: shiftId });
  });
  return box;
}

function clearHighlights() {
  document.querySelectorAll(".station").forEach(b => b.classList.remove("over-ok", "over-learn"));
}

let flashTimer = null;
function flash(msg) {
  const el = document.getElementById("flash");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") render(e.data.args);
});
window.addEventListener("resize", setFrameHeight);
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
